name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    env:
      INNO_VERSION: '7.1.0'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked |
            ConvertFrom-Json

          $version = (
            $metadata.packages |
            Where-Object name -eq 'mchose-tray'
          ).version

          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag must match Cargo.toml version: expected v$version"
          }

      - name: Check
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets

      - name: Build
        run: cargo build --locked --release

      - name: Install Inno Setup
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $versionTag = $env:INNO_VERSION.Replace('.', '_')

          Invoke-WebRequest `
            "https://github.com/jrsoftware/issrc/releases/download/is-$versionTag/innosetup-$env:INNO_VERSION-x64.exe" `
            -OutFile $installer

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw 'Inno Setup installer signature is not valid'
          }

          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/SP-',
              "/DIR=`"$compilerDir`""
            ) `
            -WindowStyle Hidden `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed: $($process.ExitCode)"
          }

          "INNO_COMPILER=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Compile setup executable
        run: |
          & $env:INNO_COMPILER installer/MchoseTray.iss

          $installers = @(Get-ChildItem dist/MCHOSE-Tray-Setup-*.exe)

          if ($installers.Count -ne 1) {
            throw 'Expected exactly one setup executable'
          }

      - name: Upload setup to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $installer = (Get-ChildItem dist/MCHOSE-Tray-Setup-*.exe).FullName
          gh release upload $env:RELEASE_TAG $installer --clobber
